<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #edf2f7, #dfeaf5);
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.12);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2f855a;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #276749;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <form onsubmit="event.preventDefault(); alert('Autenticação simulada com sucesso!');">
            <label for="usuario">Utilizador</label>
            <input type="text" id="usuario" name="usuario" placeholder="Introduza o utilizador">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Introduza a password">

            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
