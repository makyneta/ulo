<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://www.ipleiria.pt/wp-content/themes/wp-theme--ipleiria/assets/img/favicon/favicon.svg">
<style>
  :root{
    --bg: #0b0e14;
    --card: #121722;
    --border: #1f2734;
    --text: #e6e9f0;
    --muted: #8b93a3;
    --accent: #4f8cff;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    min-height:100vh;
    padding: 50px 20px 80px;
  }

  main{
    max-width: 720px;
    margin: 0 auto;
  }

  header{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom: 50px;
  }

  #brand-container{
    color: var(--text);
    text-decoration:none;
    display:inline-block;
    margin-bottom: 24px;
  }

  .logo{
    width:100%;
    max-width: 180px;
    height:auto;
  }

  .uc-code{
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  h1{
    text-align:center;
    font-size: 1.5rem;
    font-weight: 600;
  }

  h2.section-title{
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .work-list{
    list-style:none;
  }

  .work-item{
    border-bottom: 1px solid var(--border);
  }

  .work-item:last-child{ border-bottom:none; }

  .work-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    padding: 16px 4px;
    color: var(--text);
    text-decoration:none;
    font-size: 0.98rem;
    transition: color .15s ease;
  }

  .work-link:hover{
    color: var(--accent);
  }

  .work-link .arrow{
    color: var(--muted);
    font-size: 0.9rem;
    transition: color .15s ease, transform .15s ease;
  }

  .work-link:hover .arrow{
    color: var(--accent);
    transform: translateX(3px);
  }
</style>
</head>
<body>

<main>
  <ul class="work-list">
    <li class="work-item">
      <a class="work-link" href="base" target="_blank" rel="noopener">
        <span>Base</span>
        <span class="arrow">&#8594;</span>
      </a>
    </li>
  </ul>
  
  <ul class="work-list">
    <li class="work-item">
      <a class="work-link" href="curriculo" target="_blank" rel="noopener">
        <span>Curriculum</span>
        <span class="arrow">&#8594;</span>
      </a>
    </li>
  </ul>
  
  <ul class="work-list">
    <li class="work-item">
      <a class="work-link" href="event" target="_blank" rel="noopener">
        <span>Evento</span>
        <span class="arrow">&#8594;</span>
      </a>
    </li>
  </ul>
  
  <ul class="work-list">
    <li class="work-item">
      <a class="work-link" href="formcv" target="_blank" rel="noopener">
        <span>Formulário CV</span>
        <span class="arrow">&#8594;</span>
      </a>
    </li>
  </ul>
  
  <ul class="work-list">
    <li class="work-item">
      <a class="work-link" href="formulario" target="_blank" rel="noopener">
        <span>Formulário</span>
        <span class="arrow">&#8594;</span>
      </a>
    </li>
  </ul>
  
  <ul class="work-list">
    <li class="work-item">
      <a class="work-link" href="tabela" target="_blank" rel="noopener">
        <span>Tabela</span>
        <span class="arrow">&#8594;</span>
      </a>
    </li>
  </ul>
  
  <ul class="work-list">
    <li class="work-item">
      <a class="work-link" href="tabelatesp" target="_blank" rel="noopener">
        <span>Tabela TeSP</span>
        <span class="arrow">&#8594;</span>
      </a>
    </li>
  </ul>
  
  <ul class="work-list">
    <li class="work-item">
      <a class="work-link" href="torneio" target="_blank" rel="noopener">
        <span>Torneio</span>
        <span class="arrow">&#8594;</span>
      </a>
    </li>
  </ul>
  
</main>

</body>
</html>
