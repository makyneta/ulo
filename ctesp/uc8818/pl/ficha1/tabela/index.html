<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 900px;
            border: 2px solid #333;
        }

        th, td {
            border: 1px solid #666;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        img {
            display: block;
            margin: 0 auto;
            max-width: 180px;
            max-height: 120px;
            width: auto;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Ano</th>
            <th>Cilindrada</th>
            <th>Imagem</th>
        </tr>
        <tr>
            <td>BMW</td>
            <td>2000 TI Coupe</td>
            <td>1968</td>
            <td>1991</td>
            <td><img src="imgs/bmw.png" alt="BMW"></td>
        </tr>
        <tr>
            <td>Pegout</td>
            <td>208 II</td>
            <td>2019</td>
            <td>1499</td>
            <td><img src="imgs/Pegout.jpg" alt="Pegout"></td>
        </tr>
        <tr>
            <td>Audi</td>
            <td>A5 Sportback</td>
            <td>2016</td>
            <td>de 1978 a 3197</td>
            <td><img src="imgs/audi.png" alt="Audi"></td>
        </tr>
        <tr>
            <td>Mercedes</td>
            <td>W177</td>
            <td>2022</td>
            <td>de 1332 a 1991</td>
            <td><img src="imgs/mercedes.jpg" alt="Mercedes"></td>
        </tr>
    </table>
</body>
</html>
