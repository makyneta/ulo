<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição para Torneio de Videojogos</title>
</head>
<body>
    <h1>Inscrição para Torneio de Videojogos</h1>

    <form>
        <fieldset>
            <legend>Informações do Jogador</legend>

            <label for="nomeCompleto">Nome Completo:</label><br>
            <input type="text" id="nomeCompleto" name="nomeCompleto"><br><br>

            <label for="nickname">Nome de Utilizador (Nickname):</label><br>
            <input type="text" id="nickname" name="nickname"><br><br>

            <label for="email">E-mail de Contacto:</label><br>
            <input type="email" id="email" name="email"><br><br>
        </fieldset>

        <fieldset>
            <legend>Informações da Equipa</legend>

            <label for="nomeEquipa">Nome da Equipa:</label><br>
            <input type="text" id="nomeEquipa" name="nomeEquipa"><br><br>

            <label for="listaMembros">Lista de Membros da Equipa:</label><br>
            <textarea id="listaMembros" name="listaMembros" rows="5" cols="40"></textarea>
        </fieldset>

        <fieldset>
            <legend>Jogos Preferidos</legend>

            <input type="checkbox" id="lol" name="jogosPreferidos" value="League of Legends">
            <label for="lol">League of Legends</label><br>

            <input type="checkbox" id="csgo" name="jogosPreferidos" value="Counter-Strike: Global Offensive">
            <label for="csgo">Counter-Strike: Global Offensive</label><br>

            <input type="checkbox" id="fifa" name="jogosPreferidos" value="FIFA">
            <label for="fifa">FIFA</label><br>

            <input type="checkbox" id="fortnite" name="jogosPreferidos" value="Fortnite">
            <label for="fortnite">Fortnite</label><br>

            <input type="checkbox" id="valorant" name="jogosPreferidos" value="Valorant">
            <label for="valorant">Valorant</label><br>

            <input type="checkbox" id="rocketLeague" name="jogosPreferidos" value="Rocket League">
            <label for="rocketLeague">Rocket League</label><br><br>

            <label for="jogoPrincipal">Jogo Principal:</label><br>
            <input type="text" id="jogoPrincipal" name="jogoPrincipal">
        </fieldset>

        <fieldset>
            <legend>Disponibilidade</legend>

            <input type="checkbox" id="segunda" name="diasDisponibilidade" value="Segunda-feira">
            <label for="segunda">Segunda-feira</label><br>

            <input type="checkbox" id="terca" name="diasDisponibilidade" value="Terça-feira">
            <label for="terca">Terça-feira</label><br>

            <input type="checkbox" id="quarta" name="diasDisponibilidade" value="Quarta-feira">
            <label for="quarta">Quarta-feira</label><br>

            <input type="checkbox" id="quinta" name="diasDisponibilidade" value="Quinta-feira">
            <label for="quinta">Quinta-feira</label><br>

            <input type="checkbox" id="sexta" name="diasDisponibilidade" value="Sexta-feira">
            <label for="sexta">Sexta-feira</label><br>

            <input type="checkbox" id="sabado" name="diasDisponibilidade" value="Sábado">
            <label for="sabado">Sábado</label><br>

            <input type="checkbox" id="domingo" name="diasDisponibilidade" value="Domingo">
            <label for="domingo">Domingo</label><br><br>

            <label for="horaPreferida">Hora Preferida para jogar:</label><br>
            <input type="time" id="horaPreferida" name="horaPreferida">
        </fieldset>

        <fieldset>
            <legend>Preferências de Torneio</legend>

            <label for="formatoTorneio">Formato preferido do torneio:</label><br>
            <select id="formatoTorneio" name="formatoTorneio">
                <option value="Individual">Individual</option>
                <option value="Equipas (3v3)">Equipas (3v3)</option>
                <option value="Equipas (5v5)">Equipas (5v5)</option>
            </select><br><br>

            <label>Já participou em torneios anteriores?</label><br>
            <input type="radio" id="sim" name="participouAntes" value="Sim">
            <label for="sim">Sim</label>
            <input type="radio" id="nao" name="participouAntes" value="Não">
            <label for="nao">Não</label>
        </fieldset>

        <fieldset>
            <legend>Regras do Torneio</legend>

            <input type="checkbox" id="regra1" name="regras" value="Concordo em respeitar os horários estabelecidos para o torneio.">
            <label for="regra1">Concordo em respeitar os horários estabelecidos para o torneio.</label><br>

            <input type="checkbox" id="regra2" name="regras" value="Aceito seguir as normas de comportamento estabelecidas pela organização.">
            <label for="regra2">Aceito seguir as normas de comportamento estabelecidas pela organização.</label><br>

            <input type="checkbox" id="regra3" name="regras" value="Comprometo-me a não utilizar cheats ou qualquer meio ilícito.">
            <label for="regra3">Comprometo-me a não utilizar cheats ou qualquer meio ilícito.</label>
        </fieldset>

        <br>
        <input type="submit" value="Inscrever-se">
    </form>
</body>
</html>
